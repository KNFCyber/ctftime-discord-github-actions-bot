name: CTFTime

on:
  schedule:
    - cron: '0 0 * * *'

  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout custom CTFTime hooks fork
        run: |
          git clone https://github.com/nitrogency/CTFtime-Discord-hooks.git CTFtime-Discord-hooks

      - uses: actions/cache@v4
        with:
          path: ctftime_cache
          key: ${{ runner.os }}-ctftime-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ctftime-cache-

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('CTFtime-Discord-hooks/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Run CTFTime notifier
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DiscordWebhookUrl }}
        run: |
          python -m pip install --upgrade pip
          pip install -r CTFtime-Discord-hooks/requirements.txt
          python CTFtime-Discord-hooks/CTFtimeDiscordHooks.py -w "$DISCORD_WEBHOOK_URL" -d 60 -m 30 -c ctftime_cache
